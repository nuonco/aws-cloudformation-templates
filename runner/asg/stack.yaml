Description: >-
  Cloudformation Stack for Nuon Runner ASG. Should be used in the runner_nested_template_url field in stack.toml.
Parameters:
  SubnetId:
    Description: The subnet on which the app will run within the selected VPC.
    Type: AWS::EC2::Subnet::Id
  RunnerEgressGroupId:
    Description: The security group for the runner instance that allows outbound traffic.
    Type: AWS::EC2::SecurityGroup::Id
  InstallId:
    Type: String
    Description: The install ID
  RunnerId:
    Type: String
    Description: The runner ID
  RunnerApiUrl:
    Type: String
    Description: API URL for the runner
    Default: https://runner.nuon.co
  RunnerInitScriptUrl:
    Type: String
    Description: URL for the init script that is added to the use data for the Runner ASG VM instances.
    Default: https://raw.githubusercontent.com/nuonco/runner/refs/heads/main/scripts/aws/init.sh
  RunnerEnvVars:
    Type: String
    Description: Optional newline-delimited shell export statements to inject into runner user data before init script execution. e.g. `export FOO=BAR\nexport MOO=COW`.
    Default: ""
  InstanceType:
    Type: String
    Description: EC2 instance type for the runner
    Default: t3.medium
  RootVolumeSize:
    Type: Number
    Description: Size of the root EBS volume in GB
    Default: 100
    MinValue: 30
    MaxValue: 200
  EnableTelemetryIngress:
    Type: String
    Description: Create a private OTLP HTTP endpoint for the runner.
    Default: "true"
    AllowedValues:
    - "true"
    - "false"
  VpcId:
    Type: String
    Description: VPC containing the runner and telemetry endpoint. Required when telemetry ingress is enabled.
    Default: ""
  TelemetrySourcePrefixListId:
    Type: String
    Description: IPv4 prefix list allowed to send telemetry. Required when telemetry ingress is enabled.
    Default: ""
  RunnerAmiAutoUpdate:
    Type: String
    Description: Resolve the latest AL2023 AMI at every instance launch instead of once at stack create/update. Ignored when RunnerAmiId is set.
    Default: "false"
    AllowedValues:
    - "true"
    - "false"
  RunnerAmiId:
    Type: String
    Description: Pin the runner to a specific AMI ID. Leave empty to use the latest AL2023 AMI.
    Default: ""
    AllowedPattern: '^$|^ami-[0-9a-f]+$'
  NuonIdentityAccountId:
    Type: String
    Description: AWS account ID of the Nuon identity account. When set, the instance role may assume its vendor-side runner identity role there. Leave empty to keep the instance role scoped to this account only.
    Default: ""
    AllowedPattern: '^$|^[0-9]{12}$'

Rules:
  TelemetryIngressRequiresVpcId:
    RuleCondition:
      Fn::Equals:
      - Ref: EnableTelemetryIngress
      - "true"
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: VpcId
          - ""
      AssertDescription: VpcId must be provided when telemetry ingress is enabled.
  TelemetryIngressRequiresSourcePrefixList:
    RuleCondition:
      Fn::Equals:
      - Ref: EnableTelemetryIngress
      - "true"
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: TelemetrySourcePrefixListId
          - ""
      AssertDescription: TelemetrySourcePrefixListId must be provided when telemetry ingress is enabled.

Conditions:
  HasRunnerEnvVars:
    Fn::Not:
    - Fn::Equals:
      - Ref: RunnerEnvVars
      - ""
  TelemetryIngressEnabled:
    Fn::Equals:
    - Ref: EnableTelemetryIngress
    - "true"
  HasRunnerAmiId:
    Fn::Not:
    - Fn::Equals:
      - Ref: RunnerAmiId
      - ""
  RunnerAmiAutoUpdateEnabled:
    Fn::Equals:
    - Ref: RunnerAmiAutoUpdate
    - "true"
  HasNuonIdentityAccountId:
    Fn::Not:
    - Fn::Equals:
      - Ref: NuonIdentityAccountId
      - ""

Resources:
  RunnerAutoScalingGroup:
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MaxBatchSize: 1
        MinInstancesInService: 0
    Properties:
      LaunchTemplate:
        LaunchTemplateId:
          Ref: RunnerLaunchTemplate
        Version:
          Fn::GetAtt:
          - RunnerLaunchTemplate
          - LatestVersionNumber
      MaxSize: "1"
      MinSize: "1"
      TargetGroupARNs:
        Fn::If:
        - TelemetryIngressEnabled
        - - Ref: TelemetryTargetGroup
        - Ref: AWS::NoValue
      Tags:
      - Key: nuon_runner_id
        PropagateAtLaunch: false
        Value:
          Ref: RunnerId
      - Key: Name
        PropagateAtLaunch: false
        Value:
          Fn::Sub: ${AWS::StackName}-runner
      VPCZoneIdentifier:
      - Ref: SubnetId
    Type: AWS::AutoScaling::AutoScalingGroup

  TelemetryLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: TelemetryIngressEnabled
    Properties:
      GroupDescription: Access to the private runner OTLP endpoint
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 4318
        ToPort: 4318
        SourcePrefixListId:
          Ref: TelemetrySourcePrefixListId
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 4318
        ToPort: 4318
        DestinationSecurityGroupId:
          Ref: RunnerEgressGroupId

  TelemetryRunnerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: TelemetryIngressEnabled
    Properties:
      GroupId:
        Ref: RunnerEgressGroupId
      IpProtocol: tcp
      FromPort: 4318
      ToPort: 4318
      SourceSecurityGroupId:
        Ref: TelemetryLoadBalancerSecurityGroup

  TelemetryLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: TelemetryIngressEnabled
    Properties:
      Scheme: internal
      Type: network
      Subnets:
      - Ref: SubnetId
      SecurityGroups:
      - Ref: TelemetryLoadBalancerSecurityGroup

  TelemetryTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: TelemetryIngressEnabled
    Properties:
      Port: 4318
      Protocol: TCP
      TargetType: instance
      VpcId:
        Ref: VpcId
      HealthCheckEnabled: true
      HealthCheckProtocol: TCP
      HealthCheckPort: "4318"

  TelemetryListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: TelemetryIngressEnabled
    Properties:
      LoadBalancerArn:
        Ref: TelemetryLoadBalancer
      Port: 4318
      Protocol: TCP
      DefaultActions:
      - Type: forward
        TargetGroupArn:
          Ref: TelemetryTargetGroup

  RunnerInstanceProfile:
    Properties:
      InstanceProfileName:
        Fn::Sub: ${AWS::StackName}--runner-profile
      Roles:
      - Ref: RunnerInstanceRole
    Type: AWS::IAM::InstanceProfile

  RunnerInstanceRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
      Description: Instance role for the runner ec2 instance and ASG. Used to assume Provision, Deprovision, Maintenance, and custom roles as needed by the app.
      # SSM is the only managed policy; everything else is scoped inline.
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
      # The instance role may only assume this install's own roles, all named `<InstallId>-*`.
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Sid: AssumeInstallScopedRoles
            Effect: Allow
            Action:
            - sts:AssumeRole
            - sts:TagSession
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstallId}-*
          # Sole cross-account assume: the per-runner identity role in the Nuon account.
          # SetSourceIdentity stamps the session for CloudTrail attribution.
          - Fn::If:
            - HasNuonIdentityAccountId
            - Sid: AssumeNuonRunnerIdentity
              Effect: Allow
              Action:
              - sts:AssumeRole
              - sts:TagSession
              - sts:SetSourceIdentity
              Resource:
                Fn::Sub: arn:${AWS::Partition}:iam::${NuonIdentityAccountId}:role/nuon/runners/nuon-runner-${RunnerId}
            - Ref: AWS::NoValue
        PolicyName: RunnerInstanceAssumeRolePolicy
      # Write-only access to the runner's own log group; deletes are explicitly denied.
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Sid: WriteOwnLogGroup
            Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            - logs:DescribeLogStreams
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:runner-${RunnerId}
            - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:runner-${RunnerId}:*
          - Sid: DenyLogDeletion
            Effect: Deny
            Action:
            - logs:DeleteLogGroup
            - logs:DeleteLogStream
            - logs:DeleteRetentionPolicy
            Resource: '*'
        PolicyName: RunnerInstanceLogsPolicy
      Tags:
      - Key: nuon_runner_id
        Value:
          Ref: RunnerId
      - Key: runner.nuon.co/id
        Value:
          Ref: RunnerId
      - Key: nuon_install_id
        Value:
          Ref: InstallId
      - Key: install.nuon.co/id
        Value:
          Ref: InstallId
      - Key: Name
        Value:
          Fn::Sub: ${RunnerId}-runner-instance
    Type: AWS::IAM::Role

  # Lets the init script read its own instance tags. ec2:DescribeTags does not
  # support resource-level permissions, so "*" is the only valid resource.
  RunnerInstanceRoleEC2InstanceMetadataPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        Fn::Sub: ${RunnerId}-runner-ec2-instance-metadata
      Roles:
      - Ref: RunnerInstanceRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Sid: ReadOwnInstanceTags
          Effect: Allow
          Action:
          - ec2:DescribeTags
          Resource: "*"

  # Lets the runner start an instance refresh on its own ASG. Separate policy
  # because it needs a Ref to the ASG; Describe* actions cannot be resource-scoped.
  RunnerInstanceRoleSelfLifecyclePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        Fn::Sub: ${RunnerId}-runner-self-lifecycle
      Roles:
      - Ref: RunnerInstanceRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Sid: RefreshOwnAutoScalingGroup
          Effect: Allow
          Action:
          - autoscaling:StartInstanceRefresh
          - autoscaling:DescribeInstanceRefreshes
          Resource:
            Fn::Sub: arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${RunnerAutoScalingGroup}
        - Sid: DescribeAutoScalingState
          Effect: Allow
          Action:
          - autoscaling:DescribeAutoScalingGroups
          - autoscaling:DescribeAutoScalingInstances
          Resource: "*"
  RunnerLaunchTemplate:
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize:
              Ref: RootVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
        IamInstanceProfile:
          Name:
            Ref: RunnerInstanceProfile
        ImageId:
          Fn::If:
          - HasRunnerAmiId
          - Ref: RunnerAmiId
          - Fn::If:
            - RunnerAmiAutoUpdateEnabled
            - resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
            - Fn::Sub: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
        InstanceType:
          Ref: InstanceType
        NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: 0
          Groups:
          - Ref: RunnerEgressGroupId
          SubnetId:
            Ref: SubnetId
        TagSpecifications:
        - ResourceType: instance
          Tags:
          - Key: nuon_runner_id
            Value:
              Ref: RunnerId
          - Key: runner.nuon.co/id
            Value:
              Ref: RunnerId
          - Key: nuon_runner_api_url
            Value:
              Ref: RunnerApiUrl
          - Key: nuon_runner_id
            Value:
              Ref: RunnerId
          - Key: Name
            Value:
              Fn::Sub: ${RunnerId}-runner-instance
        - ResourceType: network-interface
          Tags:
          - Key: nuon_runner_id
            Value:
              Ref: RunnerId
          - Key: Name
            Value:
              Fn::Sub: ${RunnerId}-runner-eni
        UserData:
          Fn::Base64:
            Fn::Join:
            - "\n"
            - - "#!/bin/bash"
              - Fn::If:
                - HasRunnerEnvVars
                - Ref: RunnerEnvVars
                - Ref: AWS::NoValue
              - Fn::Sub: curl ${RunnerInitScriptUrl} | bash
      LaunchTemplateName:
        Fn::Sub: ${AWS::StackName}-runner
    Type: AWS::EC2::LaunchTemplate


Outputs:
  ASG:
    Description: The runner ASG.
    Value: !Ref RunnerAutoScalingGroup
  RunnerInstanceRole:
    Description: The role used by the instances managed by the Runner ASG
    Value: !Ref RunnerInstanceRole

  RunnerInstanceRoleARN:
    Description: The ARN of role used by the instances managed by the Runner ASG
    Value: !GetAtt RunnerInstanceRole.Arn
  TelemetryEndpoint:
    Description: Private plaintext OTLP HTTP endpoint, or an empty string when telemetry ingress is disabled.
    Value:
      Fn::If:
      - TelemetryIngressEnabled
      - Fn::Sub: http://${TelemetryLoadBalancer.DNSName}:4318
      - ""
