---
name: release
on:
  push:
    branches:
      - main
    paths:
      - "**/*.yaml"
      - "!.github/**"

permissions:
  contents: write
  id-token: write
  issues: read
  packages: write
  pull-requests: write
  statuses: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_REGION: us-west-2

jobs:
  bump_tag:
    name: bump tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Determine next version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          patchAll: true

      - name: Push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.semver.outputs.nextStrict }}

  publish:
    name: publish templates
    needs: bump_tag
    if: needs.bump_tag.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-cfn-templates-release
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish
        run: |
          scripts/publish.sh "${{ needs.bump_tag.outputs.new_tag }}" \
            --retention release \
            --markdown-out "$RUNNER_TEMP/published.md"

      - name: Summary
        run: |
          {
            echo "## Published ${{ needs.bump_tag.outputs.new_tag }}"
            echo
            cat "$RUNNER_TEMP/published.md"
          } >> "$GITHUB_STEP_SUMMARY"
